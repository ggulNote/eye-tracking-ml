[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-pipeline"
version = "0.1.0"
description = "Config-driven static-image data pipeline for front/side gaze estimation"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[project.scripts]
gaze-pipeline = "gaze_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
