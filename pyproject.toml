[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ggulnote-ml"
version = "0.1.0"
description = "Config-driven gaze estimation training pipeline for ggulNote"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "mlflow>=2.17,<4",
  "numpy>=1.26,<2",
  "packaging<26",
  "PyYAML>=6,<7",
  "urllib3<2; python_version<'3.10'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
video = [
  "opencv-python-headless>=4.10,<4.12",
]
landmarks = [
  # 0.10.21 is the last project-tested macOS universal2 wheel that exposes
  # mp.solutions.face_mesh, which this preprocessing module uses.
  "mediapipe==0.10.21",
]
capture = [
  "imageio-ffmpeg>=0.6,<1",
  "opencv-python>=4.10,<4.12",
  "scipy>=1.10,<2",
]

[project.scripts]
ggulnote-ml = "ggulnote_ml.cli:main"
ggulnote-capture = "ggulnote_ml.capture.cli:main"
ggulnote-video-preprocess = "ggulnote_ml.video_preprocessing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
