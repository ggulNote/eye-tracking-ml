    relative_path: side/side_up_up.jpeg
    expected_size_wh: [4032, 3024]
    view: side_profile_90
    head_level: up
    eye_level: up
    eye_annotation_valid: true
    face_bbox_xyxy: [1900, 500, 3800, 2800]
    visible_eye: right
