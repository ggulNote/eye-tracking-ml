# Manual demonstration annotations for the 3x3 strict-profile pose grid.
# Filename: side_<head level>_<eye level>.jpeg.
#
# Coordinates are source-image pixels (+x right, +y down). H0 is a
# tragion-like ear anchor and H1 is the nose tip. Their unit vector is only a
# projected 2D head-direction/pitch proxy, not calibrated 3D head pose.
#
# The six eyelid points use:
#   [p1 nasal corner, p2 upper nasal, p3 upper temporal,
#    p4 temporal corner, p5 lower temporal, p6 lower nasal]
# Therefore a0=p4/index3, a1=p3/index2, a2=p5/index4.
# These coordinates are for visualization and must be independently reviewed
# before training or evaluation.

schema_version: 1
coordinate_system:
  units: pixels
  origin: top_left
  x_positive: right
  y_positive: down

