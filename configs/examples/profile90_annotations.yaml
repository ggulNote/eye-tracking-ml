      - [1980, 1330]
      - [2050, 1360]
      - [1995, 1385]
      - [1925, 1395]
    iris_center_xy: [1940, 1360]
    profile_head_origin_xy: [2870, 1500]
    profile_head_forward_xy: [1460, 1600]
    target_gaze_xy: null
    annotation_status: manual_example_only

