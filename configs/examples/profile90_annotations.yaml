    view: side_profile_90
    eye_annotation_valid: true
    face_bbox_xyxy: [1420, 650, 3200, 2700]
    visible_eye: right
    visible_eye_bbox_xyxy: [1800, 1240, 2100, 1500]
    visible_eye_keypoints_xy:
