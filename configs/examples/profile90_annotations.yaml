# Manual annotation example for strict 90-degree profile images.
#
# Coordinates are source-image pixels with origin at the top-left (+x right,
# +y down).  This file is intentionally annotation-first: MediaPipe's 478-point
# face detector does not reliably detect these strict-profile examples.
# Re-label every training image with an annotation tool; these hand-placed
# points are a demonstrative example, not production ground truth.

schema_version: 1
coordinate_system:
  units: pixels
  origin: top_left
  x_positive: right
  y_positive: down

images:
  side_example1:
    relative_path: side/side_example1.jpeg
    expected_size_wh: [4032, 3024]
    view: side_profile_90
    eye_annotation_valid: true

    # Covers the visible profile face. This ROI is useful for a separate
    # profile-face/head-pose branch; the 128x256 eye model uses the eye ROI below.
    face_bbox_xyxy: [1400, 990, 3260, 2990]

    # A 2:1 crop around the only visible eye, including both eyelids and corners.
    # Anatomical subject side (CanonicalRecord accepts left/right).
    visible_eye: right
    visible_eye_bbox_xyxy: [1420, 1490, 1920, 1730]

    # Required order for EAR:
    # p1 corner, p2 upper-1, p3 upper-2, p4 opposite corner,
    # p5 lower-2, p6 lower-1.
    visible_eye_keypoints_xy:
      - [1595, 1615]  # p1
      - [1633, 1570]  # p2
      - [1695, 1580]  # p3
      - [1760, 1625]  # p4
      - [1705, 1660]  # p5
      - [1640, 1662]  # p6
    iris_center_xy: [1640, 1635]

    # 2D profile head direction: an ear-near anchor toward the nose tip.
    # This is an image-plane cue, not a calibrated 3D head rotation.
    profile_head_origin_xy: [2850, 1700]
    profile_head_forward_xy: [1460, 2150]

    # No screen target was recorded for this demonstration image. Therefore the
    # plotted iris/eyelid vector is an eye vertical cue, NOT calibrated gaze.
    target_gaze_xy: null
    annotation_status: manual_example_only

