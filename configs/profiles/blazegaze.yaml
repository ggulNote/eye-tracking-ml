# WebEyeTrack과 호환되는 정면 입력 전처리 설정입니다.
# 전처리와 입력 계약 검증은 구현되어 있습니다.
# generic PyTorch 모델 실행·학습·평가는 구현되어 있습니다.
# 공식 .keras는 data_ver1_smoke profile의 검증된 Keras(torch backend) factory로 실행합니다.
# generic pretrained.path는 여전히 `.pt`/`.pth` state_dict 전용입니다.

experiment:
  name: front_blazegaze_representation
  description: "WebEyeTrack-compatible front eye-patch representation learning"
  tags:
    reference: arxiv_2508_19544v1
    reference_repository: RedForestAI_WebEyeTrack
    model_family: BlazeGaze
    preprocessing_contract: webeyetrack_eye_patch_v1
    training_stage: representation_learning

preprocessing:
  branch_overrides:
    front:
      enabled: true
      # 모델 입력 계약과 비교할 전처리 식별자입니다.
      representation: webeyetrack_eye_patch_v1

      face_landmarks:
        # 실패한 row는 유지하되 학습 유효성 mask를 끕니다.
        enabled: true
        source: mediapipe_face_landmarker
        # 환경 변수로 MediaPipe 모델 경로를 변경할 수 있습니다.
        model_path: "${oc.env:MEDIAPIPE_FACE_MODEL,./models/face_landmarker_v2_with_blendshapes.task}"
        expected_landmarks: 478
        # 이후 기하 계산에 필요한 깊이, 신뢰도와 얼굴 변환을 보관합니다.
        output_uvz: true
        output_visibility_presence: true
        output_face_transform: true
        on_failure: mark_invalid

      eye_selection:
        enabled: true
        mode: both
        target_eye: null
        # 한쪽 눈이라도 가시성 점수가 기준보다 낮으면 무효로 처리합니다.
        min_visibility: 0.60
        canonicalize_to: none  # 해부학적 좌우 방향을 유지합니다.
        on_failure: mark_invalid

      eye_state:
        enabled: true
        method: ear
        # 초기 EAR 기준이며 새 DB의 validation 사람들로 보정해야 합니다.
        threshold: 0.20
        # 정면에서 한쪽 눈이라도 감기면 해당 시선 sample을 사용하지 않습니다.
        required_eye_policy: all_open
        on_closed: mark_invalid
        landmark_indices:
          left: [362, 385, 387, 263, 373, 380]
          right: [133, 158, 160, 33, 144, 153]
        on_failure: mark_invalid

      metric_head_pose:
        enabled: true
        method: webeyetrack_radial_procrustes
        output_unit: cm
        # 공식 .keras 모델은 head_vector와 face_origin_3d를 함께 입력받습니다.
        output_representation: webeyetrack_components
        face_origin_source: annotation_or_reconstruct
        # manifest에 3D annotation을 넣을 경우 mm 단위를 사용합니다.
        annotation_unit: mm
        required_irises: both
        # iris 크기를 기준으로 반복 계산하여 metric 깊이를 보정합니다.
        iris_diameter_cm: 1.20
        initial_depth_cm: 60.0
        max_iterations: 10
        max_depth_step_cm: 5.0
        keep_metric_face: false
        on_failure: mark_invalid

      eye_region_warp:
        enabled: true
        method: webeyetrack_obtain_eyepatch_v1
        # landmark 번호는 코드에 고정되어 있고 아래 값만 조정할 수 있습니다.
        face_crop_size: 512               # 중간 정사각형 얼굴 warp 크기입니다.
        radial_padding_xy: [0.40, 0.20]   # 얼굴 영역의 가로·세로 여백 비율입니다.
        size_hw: [128, 512]               # 최종 양안 eye strip의 [높이, 너비]입니다.
        on_failure: mark_invalid

      face_roi:
        enabled: false
      background_mask:
        enabled: false
      resize:
        # eye_region_warp에서 이미 최종 크기를 만듭니다.
        enabled: false
      normalize:
        enabled: true
        mode: zero_one
        output_dtype: float32
        channel_order: CHW

data:
  dataloader:
    # 128x512 입력의 메모리 사용량을 고려한 기본 batch 크기입니다.
    batch_size: 8

model:
  front:
    enabled: true
    # 이 profile은 전처리 계약만 고정합니다. 공식 model factory는 data_ver1_smoke에서 연결합니다.
    source_dir: null
    entrypoint: null
    adapter_entrypoint: null
    compatibility:
      # 실험 호환성 metadata입니다. generic runner가 preprocessing_id를 자동 비교하지 않습니다.
      preprocessing_id: webeyetrack_eye_patch_v1
      official_framework: tensorflow_keras
      on_mismatch: error
    initialization:
      # 호환성 metadata입니다. 이 mapping 자체는 model을 생성하지 않습니다.
      # 공식 archive 실행은 webeyetrack_front factory의 init_args에서 경로와 SHA를 받습니다.
      mode: external_keras_reference
      load_scope: full_model
      importer_entrypoint: null
    pretrained:
      # generic loader는 `.pt`/`.pth` state_dict 전용이므로 공식 `.keras`는 여기에 넣지 않습니다.
      path: null
      sha256: null
      strict: true  # checkpoint의 이름과 shape가 정확히 일치해야 합니다.
    input_contract:
      # pipeline은 PyTorch CHW 형식을 사용하며 TensorFlow adapter가 NHWC로 바꿉니다.
      # validity_key는 감긴 눈이나 전처리 실패 sample을 제외합니다.
      image_key: front_image
      shape: [B, 3, 128, 512]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
      validity_key: front_gaze_valid
      auxiliary_keys:
        # RGB eye strip과 카메라 좌표계의 머리 방향·얼굴 원점을 함께 사용합니다.
        head_vector:
          key: front_head_vector
          shape: [B, 3]
          coordinate_system: camera
        face_origin_3d:
          key: front_face_origin_3d
          shape: [B, 3]
          unit: cm
          coordinate_system: camera
    output_contract:
      # adapter가 아래 표준 key로 출력 형식을 정규화합니다.
      gaze_key: gaze_xy
      gaze_shape: [B, 2]
      embedding_key: front_embedding
      embedding_shape: [B, 512]
      reconstruction_key: reconstructed_eye_region

training:
  # representation 학습 epoch 수입니다.
  max_epochs: 20

optimizer:
  # 참고 논문과 맞춘 Adam 설정입니다.
  name: Adam
  learning_rate: 0.001
  weight_decay: 0.0

scheduler:
  # 매 epoch마다 학습률에 gamma를 곱합니다.
  enabled: true
  name: ExponentialLR
  gamma: 0.95
  monitor: null

loss:
  # generic runner는 primary weighted L2를 실행합니다.
  # 아래 보조 loss는 custom trainer/adapter가 소비할 수 있는 확장 계약입니다.
  primary:
    name: weighted_l2_xy
    prediction_key: gaze_xy
    target_key: target_gaze_xy
    mask_key: front_gaze_valid
    weight: 1.0
    # 각 batch에서 화면을 30x30으로 나누고 빈도가 낮은 target의 가중치를 높입니다.
    frequency_grid_size: [30, 30]
    delta: null  # weighted L2에서는 사용하지 않는 공통 계약 필드입니다.
  reconstruction:
    # generic runner에는 없는 custom objective이므로 기본 비활성화합니다.
    enabled: false
    name: mse
    prediction_key: reconstructed_eye_region
    target_key: front_image
    weight: 1.0
  embedding_consistency:
    # generic runner에는 없는 custom objective이므로 기본 비활성화합니다.
    enabled: false
    name: gaze_distance_consistency
    embedding_key: front_embedding
    target_key: target_gaze_xy
    mask_key: front_gaze_valid
    weight: 1.0

# 2단계 first-order MAML에는 사람별 support/query 설정을 추가해야 합니다.
