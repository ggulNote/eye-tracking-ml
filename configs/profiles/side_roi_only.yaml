# Side 눈 bbox만 준비된 데이터용 image-only 전처리 override입니다.
# config.yaml -> side_profile_90.yaml -> 이 파일 -> Side model profile 순서로 적용합니다.
# 눈꺼풀·iris·측면 head anchor가 없어도 side_image [B,3,128,256]를 생성합니다.

experiment:
  tags:
    side_input: one_eye_roi_only

preprocessing:
  branch_overrides:
    side:
      representation: profile90_bbox_roi_v1
      eye_region_warp:
        enabled: true
        method: profile90_annotation
        size_hw: [128, 256]
        bbox_key: visible_eye_bbox_xyxy
        # 사람별 눈 bbox를 그대로 잘라 128x256으로 직접 resize합니다. 검은 padding은 없습니다.
        crop_mode: stretch
        bbox_scale_xy: [1.0, 1.0]
        on_failure: mark_invalid
        feature_extraction:
          # 아래 입력은 annotation이 있을 때만 true로 선택합니다. side_image는 항상 생성됩니다.
          side_headpose:
            enabled: false
            source: side_2d
          side_eyeangle:
            enabled: false
          side_eyelidangle:
            enabled: false

model:
  side:
    input_contract:
      forward_keys: auto
      image_key: side_image
      shape: [B, 3, 128, 256]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
      validity_key: side_gaze_valid
