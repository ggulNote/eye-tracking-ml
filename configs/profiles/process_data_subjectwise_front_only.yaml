# process_data subject-wise dual-view 실험과 동일한 split/loss/metric 조건에서
# BlazeGaze Front만 사용하는 통제 비교군입니다.
# Side 관련 preprocessing/model profile 뒤에 마지막으로 적용합니다.

experiment:
  name: process_data_subjectwise_front_only
  description: "subject_id split에서 BlazeGaze Front-only controlled baseline"
  tags:
    split_unit: subject_id
    subject_wise: true
    ablation: front_only
    side_encoder: disabled

preprocessing:
  branch_overrides:
    side:
      enabled: false

model:
  side:
    enabled: false

fusion:
  enabled: false

loss:
  # process_data.yaml의 3x3 grid auxiliary loss는 그대로 유지합니다.
  branch_auxiliary:
    enabled: false
    front_weight: 0.0
    side_weight: 0.0
