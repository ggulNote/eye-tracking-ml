# data(ver1)의 p00/p03만 사용하는 실행 연결 smoke 설정입니다.
# blazegaze.yaml, side_profile_90.yaml 다음에 마지막으로 적용해야 합니다.
# 원본 protocol split을 쓰지 않고 subject 전체를 고정 순서로 분리합니다.
# phonecam은 실험 설계상 90도 바로 측면입니다.
# 단, 원본 participant.json의 30~45도 표기는 촬영 의도와 충돌하는 기존 metadata입니다.
# --dummy-side-annotations 값은 배선 확인용 고정 좌표이며 정답 label이 아닙니다.
# annotation_source 표시는 생성한 source manifest에만 남고 canonical prepare에는 보존되지 않습니다.

experiment:
  name: data_ver1_smoke
  run_name: data_ver1_smoke_run
  description: "Read-only data(ver1) manifest and pipeline wiring smoke test"
  tags:
    dataset: data_ver1
    purpose: real_db_wiring_smoke
    split_contract: p00_train_p03_validation_test_empty
    side_capture_geometry: strict_profile_90_user_confirmed
    source_geometry_metadata: participant_json_30_to_45_requires_correction
    side_annotation_policy: dummy_wiring_only_when_opted_in

paths:
  # 원본 DB 밖의 별도 경로를 환경 변수로 지정합니다.
  output_root: "${oc.env:GAZE_OUTPUT_ROOT,./outputs}"

data:
  dataset_name: data_ver1_smoke
  reader:
    type: generic_csv
    manifest_path: "${oc.env:DATA_VER1_MANIFEST,./data/data_ver1_smoke_manifest.csv}"
    verify_image_exists: true
    verify_image_shape: true
    target_bounds_policy: error
  pairing:
    enabled: true
  split:
    # shuffle=false이면 정렬된 p00은 train, p03은 validation에 들어갑니다.
    ratios:
      train: 0.50
      validation: 0.50
      test: 0.0
    shuffle_groups: false
  dataloader:
    batch_size: 2
    num_workers: 0
    pin_memory: false
    persistent_workers: false

preprocessing:
  branch_overrides:
    front:
      # 이 offline DB는 수집 단계에서 눈 감김을 제거했다고 가정합니다.
      # 실제 open-eye 5장이 EAR 0.20에서 오검출되어 이 profile에서만 gate를 끕니다.
      # 실시간 WebEyeTrack 추론에서는 blazegaze.yaml의 EAR gate를 계속 사용할 수 있습니다.
      eye_state:
        enabled: false

model:
  front:
    enabled: true
    source_dir: null
    # 공식 .keras archive를 Keras 3 torch backend로 안전하게 감싼 factory입니다.
    entrypoint: gaze_pipeline.models.webeyetrack_front:create_model
    adapter_entrypoint: null
    init_args:
      weights_path: "${oc.env:WEBEYETRACK_WEIGHTS,./models/blazegaze_mpiifacegaze.keras}"
      expected_sha256: 5b011cfe82466896e27b1ac3e18130117cafbc02dbc964a1ad7315f62005cc05
      unfreeze_encoder: false
    # .keras는 factory가 직접 검증·로딩하며 PyTorch state_dict loader는 사용하지 않습니다.
    pretrained:
      path: null
      sha256: null
      strict: true
  side:
    enabled: true
    source_dir: null
    # 실제 눈 이미지와 선택된 더미 기하 feature를 모두 소비하는 작은 smoke model입니다.
    # 최종 Side 아키텍처나 정확도 모델을 뜻하지 않습니다.
    entrypoint: gaze_pipeline.models.simple_side:create_model
    adapter_entrypoint: null
    init_args:
      image_key: side_image
      feature_keys: [side_head_pose_2d, side_eye_angles, side_iris_pose_2d]
      embedding_dim: 32
    output_contract:
      embedding_shape: [B, 32]

training:
  # 실제 성능 평가가 아닌 입출력 연결 확인용입니다.
  max_epochs: 1
  accelerator: cpu
  early_stopping:
    enabled: false

scheduler:
  enabled: false

mlflow:
  # raw image는 올리지 않고 외부 URI에 smoke lineage·metric·checkpoint를 기록합니다.
  enabled: true
  tracking_uri: "${oc.env:MLFLOW_TRACKING_URI,sqlite:///./mlflow-data-ver1-smoke.db}"
  experiment_name: data_ver1_smoke
  run_name: data_ver1_smoke_run
  tags:
    dataset: data_ver1
    purpose: real_db_wiring_smoke
    split_contract: p00_train_p03_validation_test_empty
    side_capture_geometry: strict_profile_90_user_confirmed
    source_geometry_metadata: participant_json_30_to_45_requires_correction
    side_annotation_policy: dummy_wiring_only_when_opted_in
