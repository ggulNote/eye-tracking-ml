# 90도 phonecam 이미지용 annotation 기반 측면 전처리 설정입니다.
# config.yaml과 blazegaze.yaml 다음에 적용합니다.
# 눈 ROI·선택 feature와 generic PyTorch residual 학습을 지원합니다.

experiment:
  # 90도 측면 실험을 구분하는 MLflow 이름입니다.
  name: dual_view_profile90
  description: "Exact front BlazeGaze input plus strict-profile one-eye side input"
  tags:
    side_geometry: strict_profile_90
    side_preprocessing_contract: profile90_selectable_features_v3

data:
  views:
    available: [front, side]

preprocessing:
  branch_overrides:
    side:
      enabled: true
      representation: profile90_selectable_features_v3

      # 90도 측면은 한쪽 눈만 보이므로 정면용 478개 face mesh를 요구하지 않습니다.
      # 눈과 머리 위치는 manifest annotation에서 읽습니다.
      face_landmarks:
        enabled: false
      eye_selection:
        enabled: false
      eye_state:
        enabled: false
      metric_head_pose:
        enabled: false

      eye_region_warp:
        # 이 단계는 feature 선택과 관계없이 side_image를 항상 생성합니다.
        enabled: true
        method: profile90_annotation
        # 최종 한쪽 눈 tensor의 [높이, 너비]입니다.
        size_hw: [128, 256]
        # 각 측면 annotation row에서 읽을 key입니다.
        bbox_key: visible_eye_bbox_xyxy
        eyelid_keypoints_key: visible_eye_keypoints_xy
        iris_center_key: iris_center_xy
        head_origin_key: profile_head_origin_xy
        head_forward_key: profile_head_forward_xy
        # 눈꺼풀 6점으로 기울기를 보정한 2:1 crop을 만듭니다.
        # bbox만 있으면 EAR을 계산할 수 없습니다.
        crop_mode: affine
        # 눈 너비와 눈 뜬 높이에 곱할 crop 여백 비율입니다.
        landmark_crop_scale_xy: [2.4, 1.2]
        # 측면용 초기 EAR 기준이며 새 DB의 validation split으로 보정해야 합니다.
        ear_threshold: 0.20
        # a0=p4 눈꼬리, a1=p3 위쪽 점, a2=p5 아래쪽 점입니다.
        eyelid_tail_indices: [3, 2, 4]
        # 아래 값은 보조 feature만 선택하며 side_image 생성에는 영향을 주지 않습니다.
        feature_extraction:
          side_headpose:
            # true이면 머리 방향 feature를 Side 모델 입력에 추가합니다.
            enabled: true
            # side_2d는 귀 근처 기준점에서 코끝으로 향하는 2D 단위 벡터입니다.
            # front_3d는 짝지어진 정면 이미지의 3D 머리 방향을 사용합니다.
            source: side_2d
            side_2d_key: side_head_pose_2d
            front_3d_key: front_head_vector
            # front_3d를 쓰려면 짝지어진 정면 머리 방향이 유효해야 합니다.
            front_3d_validity_key: front_head_orientation_valid
            front_3d_coordinate_frame: front_camera
            # 정면 방향이 없거나 무효면 0으로 채우고 학습 대상에서 제외합니다.
            front_3d_invalid_policy: zero_fill_and_mask
          side_eyeangle:
            # true이면 a0→a1과 a0→a2의 두 방향각을 생성합니다.
            enabled: true
            key: side_eye_angles
          side_eyelidangle:
            # 이름은 유지하지만 실제 값은 iris의 상대 위치입니다.
            enabled: true
            # canonical key로 iris 기반 feature임을 명확히 구분합니다.
            key: side_iris_pose_2d
            vertical_only: true  # true이면 가로 성분을 0으로 두고 세로 성분만 사용합니다.
        # 눈꺼풀 6점이 없을 때 bbox에 적용할 [가로, 세로] 확대 비율입니다.
        bbox_scale_xy: [1.25, 1.50]
        pad_rgb: [0, 0, 0]  # 원본 이미지 밖의 영역은 검은색으로 채웁니다.
        # 감긴 눈과 실패 sample은 검은 tensor로 유지하고 유효성 mask를 끕니다.
        on_closed: mark_invalid
        on_failure: mark_invalid

      face_roi:
        enabled: false
      background_mask:
        enabled: false
      resize:
        enabled: false
      normalize:
        # uint8 RGB 이미지를 [0,1] 범위의 float32 CHW로 변환합니다.
        enabled: true
        mode: zero_one
        output_dtype: float32
        channel_order: CHW

model:
  side:
    enabled: true
    initialization:
      # 별도 importer용 metadata이며 generic runner가 이 설정으로 Keras 전이를 실행하지 않습니다.
      mode: webeyetrack_encoder_transfer
      source_framework: tensorflow_keras
      path: "${oc.env:WEBEYETRACK_WEIGHTS,./models/blazegaze_mpiifacegaze.keras}"
      load_scope: convolution_depthwise_batchnorm_encoder
      # 공식 512차원 MLP는 256차원 한쪽 눈 embedding과 맞지 않아 다시 초기화합니다.
      reinitialize: [spatial_projection, gaze_mlp, gaze_output]
      # Keras weight 변환 함수를 별도로 구현한 경우에만 지정합니다.
      importer_entrypoint: null
    compatibility:
      # 실험 호환성 metadata이며 generic runner가 preprocessing_id를 자동 비교하지 않습니다.
      preprocessing_id: profile90_selectable_features_v3
      on_mismatch: error
    input_contract:
      # side_image 뒤에 활성화된 보조 feature만 자동으로 추가합니다.
      forward_keys: auto
      # side_image는 항상 존재하고 나머지 key는 feature 설정에 따릅니다.
      image_key: side_image
      shape: [B, 3, 128, 256]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
      validity_key: side_gaze_valid
      # 유효성 mask는 loss와 fusion에만 사용하며 신경망 입력에는 넣지 않습니다.
      validity_role: loss_metric_fusion_mask
      validity_passed_to_model: false
      auxiliary_keys:
        # 아래 항목은 shape와 좌표계를 정의하고 실제 선택은 위의 feature 설정이 담당합니다.
        side_headpose:
          enabled_from: preprocessing.branch_overrides.side.eye_region_warp.feature_extraction.side_headpose.enabled
          source_from: preprocessing.branch_overrides.side.eye_region_warp.feature_extraction.side_headpose.source
          side_2d:
            key: side_head_pose_2d
            shape: [B, 2]
            coordinate_system: source_image_plane_x_right_y_down
            meaning: unit_vector_from_profile_head_origin_to_nose_tip
          front_3d:
            key: front_head_vector
            shape: [B, 3]
            coordinate_system: front_camera
            validity_key: front_head_orientation_valid
            invalid_policy: zero_fill_and_mask
            requires_paired_front: true
        side_eyeangle:
          key: side_eye_angles
          shape: [B, 2]
          dtype: float32
          value_range: [-1.0, 1.0]
          unit: radians_divided_by_pi
          order: [a0_to_a1_upper, a0_to_a2_lower]
          coordinate_system: semantic_eye_local_x_inward_y_upper_to_lower
        side_eyelidangle:
          key: side_iris_pose_2d
          shape: [B, 2]
          dtype: float32
          coordinate_system: eye_aligned_image_plane_x_right_y_down
          meaning: iris_minus_eyelid_center_normalized_by_eye_width_and_opening
          vertical_only: true
      diagnostics:
        # 진단값은 기록과 시각화에만 사용하며 모델에는 전달하지 않습니다.
        ear:
          key: side_ear
          role: selected_eye_open_closed_quality
          passed_to_model: false
        selected_eye:
          key: side_selected_eye_index
          role: annotation_traceability
          passed_to_model: false
        eyelid_tail_vectors:
          role: construct_and_visualize_two_eye_direction_angles
          passed_to_model: false
    output_contract:
      # Side는 Front의 y축에 더할 residual 하나만 예측합니다.
      gaze_key: null
      gaze_shape: null
      delta_y_key: delta_y_side
      delta_y_shape: [B, 1]
      embedding_key: side_embedding
      embedding_shape: [B, 256]

loss:
  # side_gaze_valid가 true인 row만 Side residual loss에 사용합니다.
  branch_auxiliary:
    enabled: true
    side_weight: 1.0
    side_mask_key: side_gaze_valid

fusion:
  # 이 profile을 적용하면 Front 좌표에 Side y residual을 결합합니다.
  enabled: true
  method: y_axis_residual
  input_keys: [front.gaze_xy, side.delta_y_side]
