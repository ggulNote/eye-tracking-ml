# Side-phone profile that targets the most visible single eye.
# For paired custom data, also merge configs/profiles/dual_view_images.yaml.
# Status: preprocessing and the input contract are implemented.
# Planned: WebEyeTrack weight importing, model training, and evaluation.

experiment:
  name: dual_view_side_one_eye_experimental
  description: "Dual-view gaze with a selected side-eye crop and metric head pose"
  tags:
    side_representation: one_eye
    side_preprocessing_contract: side_one_eye_v1

data:
  views:
    available: [front, side]

preprocessing:
  branch_overrides:
    side:
      enabled: true
      representation: side_one_eye_v1

      face_landmarks:
        enabled: true
        source: mediapipe_face_landmarker
        model_path: "${oc.env:MEDIAPIPE_FACE_MODEL,./models/face_landmarker_v2_with_blendshapes.task}"
        expected_landmarks: 478
        output_uvz: true
        output_visibility_presence: true
        output_face_transform: true
        # Extreme profile views can be detector-direction sensitive.
        mirror_retry: true
        on_failure: mark_invalid

      eye_selection:
        enabled: true
        mode: best_visible
        target_eye: auto
        min_visibility: 0.60
        canonicalize_to: none
        on_failure: mark_invalid

      eye_state:
        enabled: true
        method: ear
        threshold: 0.20
        # The far/occluded eye must not invalidate a usable profile image.
        required_eye_policy: selected_eye_open
        on_closed: mark_invalid
        landmark_indices:
          left: [362, 385, 387, 263, 373, 380]
          right: [133, 158, 160, 33, 144, 153]
        on_failure: mark_invalid

      metric_head_pose:
        enabled: true
        method: webeyetrack_radial_procrustes
        output_unit: cm
        output_representation: webeyetrack_components
        face_origin_source: annotation_or_reconstruct
        annotation_unit: mm
        required_irises: selected_eye
        iris_diameter_cm: 1.20
        initial_depth_cm: 60.0
        max_iterations: 10
        max_depth_step_cm: 5.0
        keep_metric_face: false
        on_failure: mark_invalid

      eye_region_warp:
        enabled: true
        method: selected_eye_similarity
        # Final one-eye tensor size consumed by the side model.
        size_hw: [128, 256]
        pad_rgb: [0, 0, 0]
        on_failure: mark_invalid

      face_roi:
        enabled: false
      background_mask:
        enabled: false
      resize:
        enabled: false
      normalize:
        enabled: true
        mode: zero_one
        output_dtype: float32
        channel_order: CHW

model:
  side:
    enabled: true
    initialization:
      # WebEyeTrack weights on a one-eye distribution are transfer learning,
      # not exact checkpoint compatibility. Custom is therefore the safe default.
      mode: custom_backbone
      allowed_modes: [custom_backbone, webeyetrack_encoder_transfer]
      webeyetrack_encoder_transfer:
        path: "${oc.env:WEBEYETRACK_WEIGHTS,./models/blazegaze_mpiifacegaze.keras}"
        source_framework: tensorflow_keras
        # Set this when the TensorFlow-to-PyTorch importer is implemented.
        importer_entrypoint: null
        load_scope: convolutional_encoder_only
        reinitialize_shape_dependent_layers: true
        allow_representation_shift: false
    compatibility:
      preprocessing_id: side_one_eye_v1
      on_mismatch: error
    input_contract:
      image_key: side_image
      shape: [B, 3, 128, 256]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
      validity_key: side_gaze_valid
      auxiliary_keys:
        head_vector:
          key: side_head_vector
          shape: [B, 3]
          coordinate_system: camera
        face_origin_3d:
          key: side_face_origin_3d
          shape: [B, 3]
          unit: cm
          coordinate_system: camera
        selected_eye:
          key: side_selected_eye_index
          shape: [B]
          dtype: int64
          encoding: left_0_right_1_both_2_invalid_minus_1
    output_contract:
      gaze_key: gaze_xy
      gaze_shape: [B, 2]
      embedding_key: side_embedding
      embedding_shape: [B, D_side]
      uncertainty_key: null

loss:
  branch_auxiliary:
    enabled: true
    side_weight: 1.0
    side_mask_key: side_gaze_valid
