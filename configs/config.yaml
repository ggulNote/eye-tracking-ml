# 정면·측면 정지 이미지 시선 추정 파이프라인의 기본 설정입니다.
# 새로 수집할 데이터와 manifest를 기본 입력으로 사용합니다.
# 데이터 준비와 generic PyTorch 학습·평가 실행기가 함께 사용하는 설정입니다.

schema_version: 1

experiment:
  # 같은 목적의 실행을 묶는 이름과 실행 시각이 포함된 개별 실행 이름입니다.
  name: dual_view_gaze_pipeline
  run_name: "${experiment.name}-${now:%Y%m%d_%H%M%S}"
  description: "새로 구축한 webcam·phonecam 이미지 DB용 파이프라인"
  # 데이터 분할과 증강의 재현성을 위한 값입니다.
  seed: 42
  deterministic: true
  tags:
    dataset: custom_dual_view
    task: screen_point_regression
    data_unit: image

paths:
  # 개인 절대경로는 저장하지 않고 환경 변수로 입력합니다.
  data_root: "${oc.env:GAZE_DATA_ROOT,./data/dual_view}"
  output_root: "${oc.env:GAZE_OUTPUT_ROOT,./outputs}"
  run_dir: "${paths.output_root}/${experiment.name}/${experiment.run_name}"
  checkpoint_dir: "${paths.run_dir}/checkpoints"
  model_dir: "${paths.run_dir}/models"
  metric_dir: "${paths.run_dir}/metrics"
  prediction_dir: "${paths.run_dir}/predictions"

task:
  # 이미지 한 장마다 화면 시선 좌표 [x,y]를 예측합니다.
  type: screen_point_regression
  output_key: gaze_xy
  output_dim: 2
  output_order: [x, y]
  output_dtype: float32
  coordinate_system:
    name: centered_normalized_screen
    # 화면 중심을 0으로 만드는 정규화 방식입니다.
    normalization_denominator: screen_size
    # 실제 픽셀 범위의 오른쪽·아래 끝은 0.5보다 조금 작습니다.
    observed_range_semantics: left_closed_right_open
    target_range: [-0.5, 0.5]
    origin: screen_center
    x_positive_direction: right
    y_positive_direction: down
  # 음수 좌표를 유지하기 위해 기본 출력 활성화는 identity를 사용합니다.
  output_activation: identity
  scaled_tanh_scale: 0.5
  clamp_for_metrics: false
  clamp_for_visualization: true
  uncertainty:
    # 축별 불확실성 예측 기능이며 현재는 사용하지 않습니다.
    enabled: false
    output_key: log_variance_xy
    parameterization: log_variance

data:
  mode: image
  dataset_name: custom_dual_view
  dataset_root: "${paths.data_root}"
  image_extensions: [.jpg, .jpeg, .png]

  # 새 DB의 이미지와 label을 연결하는 CSV manifest를 읽습니다.
  reader:
    type: generic_csv
    manifest_path: "${oc.env:DUAL_VIEW_MANIFEST,./data/dual_view_manifest.csv}"
    verify_image_exists: true
    verify_image_shape: true
    fail_on_bad_row: true
    # 화면 범위를 벗어난 label은 데이터 오류로 처리합니다.
    target_bounds_policy: error

  selection:
    # null은 전체 session을 사용합니다. 특정 head pose만 쓸 때 list로 지정합니다.
    # 예: [head_down, neutral]
    session_ids: null

  # webcam은 정면, phonecam은 90도 측면 branch로 연결합니다.
  views:
    available: [front, side]
    source_to_branch:
      webcam: front
      phonecam: side
    directory_to_branch:
      webcam: front
      phonecam: side

  pairing:
    # 같은 촬영 시점의 두 이미지는 동일한 pair_id로 연결합니다.
    enabled: true
    unit: image
    strategy: explicit_pair_id
    pair_id_key: pair_id
    require_same_subject: true
    require_same_target: true
    # 0.0이면 두 이미지의 정규화 시선 label이 정확히 같아야 합니다.
    max_target_distance_normalized: 0.0
    # 짝이 없는 이미지는 manifest에는 남지만 dual-view trainer에서는 사용하지 않습니다.
    unpaired_policy: branch_only
    # 데이터 준비 단계의 pairing 검증용이며 final metric은 유효한 Front를 유지합니다.
    exclude_unpaired_from_fusion_metrics: true

  split:
    # 같은 사람이 여러 split에 섞이지 않도록 사람 단위로 분할합니다.
    strategy: grouped_ratio
    group_key: subject_id
    ratios:
      train: 0.70
      validation: 0.15
      test: 0.15
    seed: "${experiment.seed}"
    shuffle_groups: true
    stratify_by: null
    prevent_group_leakage: true
    # 전체 및 train/validation/test manifest 저장 위치입니다.
    manifest_dir: "${paths.run_dir}/manifests"

  dataloader:
    # batch 크기와 병렬 이미지 로딩 설정입니다.
    batch_size: 32
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    train_shuffle: true
    validation_shuffle: false
    test_shuffle: false
    drop_last_train: false

preprocessing:
  # [구현] Dataset이 활성화된 단계를 아래 순서대로 실행합니다.
  stage_order:
    - decode
    - exif_orientation
    - validate
    - face_landmarks
    - eye_selection
    - metric_head_pose
    - eye_region_warp
    - face_roi
    - background_mask
    - resize
    - normalize
    - augment

  decode:
    enabled: true
    backend: opencv
    source_color_order: BGR
    output_color_order: RGB
    output_dtype: uint8

  exif_orientation:
    enabled: true

  validate:
    enabled: true
    reject_corrupt: true
    min_width_px: 32
    min_height_px: 32

  face_landmarks:
    # manifest에 landmark가 있으면 사용하고, 없으면 검출기로 대체합니다.
    enabled: true
    source: annotation
    # annotation이 없을 때만 OpenCV Haar 검출기를 생성합니다.
    fallback_detector: opencv_haar
    # 두 방법 모두 실패하면 해당 sample을 제외합니다.
    on_failure: drop

  eye_selection:
    # 양쪽 눈, 고정된 눈 또는 가장 잘 보이는 눈을 선택할 때 사용합니다.
    enabled: false
    mode: both
    target_eye: null
    # 가시성 점수가 이 값보다 낮으면 해당 눈을 무효로 처리합니다.
    min_visibility: 0.60
    # none은 해부학적 좌우 방향을 그대로 유지합니다.
    canonicalize_to: none
    # mark_invalid는 batch 형태를 유지하면서 유효성 mask만 끕니다.
    on_failure: mark_invalid

  metric_head_pose:
    # WebEyeTrack 방식으로 metric head pose를 복원합니다.
    # BlazeGaze 입력은 head_vector [3]과 face_origin_3d [3]입니다.
    enabled: false
    method: webeyetrack_radial_procrustes
    output_unit: cm
    output_representation: webeyetrack_components
    face_origin_source: annotation_or_reconstruct
    annotation_unit: mm
    required_irises: both
    # iris 크기 가정과 반복 깊이 계산의 제한값입니다.
    iris_diameter_cm: 1.20
    initial_depth_cm: 60.0
    max_iterations: 10
    max_depth_step_cm: 5.0
    keep_metric_face: false
    # 실패한 sample은 유지하되 시선 학습 대상에서는 제외합니다.
    on_failure: mark_invalid

  eye_region_warp:
    # 공통 기본값이며 BlazeGaze와 profile90 설정이 branch별 값으로 덮어씁니다.
    enabled: false
    method: landmark_homography
    size_hw: [128, 512]
    on_failure: drop

  face_roi:
    # margin_ratio는 landmark box의 여백이며 keep_full_face는 얼굴 전체를 유지합니다.
    enabled: false
    source: landmarks_bbox
    margin_ratio: 0.20
    keep_full_face: true
    on_failure: use_full_image

  background_mask:
    # 현재 Front/Side 입력은 별도 eye ROI를 사용하므로 기본값은 비활성화합니다.
    enabled: false
    method: face_hull
    fill_rgb: [0, 0, 0]
    # 0은 경계를 선명하게 유지하며 값이 커질수록 부드럽게 혼합됩니다.
    feather_px: 0

  resize:
    # size_hw 순서는 [높이, 너비]이며 남는 영역은 pad_rgb로 채웁니다.
    enabled: true
    size_hw: [224, 224]
    keep_aspect_ratio: true
    pad_rgb: [0, 0, 0]
    interpolation_train: bilinear
    interpolation_eval: bilinear

  normalize:
    enabled: true
    # zero_one은 uint8 값을 255로 나누어 [0,1]로 변환합니다.
    mode: zero_one
    mean: null
    std: null
    output_dtype: float32
    channel_order: CHW

  augment:
    # 활성화하면 아래 확률과 범위를 train split에만 적용합니다.
    enabled: false
    apply_to: train_only
    horizontal_flip_probability: 0.0
    color_jitter:
      enabled: false
      brightness: 0.1
      contrast: 0.1
      saturation: 0.1
      hue: 0.02

  cache:
    # true이면 augmentation 직전의 결정적 전처리 결과를 sample별 .pkl로 재사용합니다.
    enabled: false
    dir: "${paths.output_root}/preprocessed_cache"
    # read_write: 읽기+생성, read_only: 쓰지 않음, refresh: 이 실행의 최초 접근에서 재생성
    mode: read_write
    format: pickle
    schema_version: 1
    implementation_id: ordered-gaze-preprocessor-v2
    # pickle은 신뢰하는 로컬 cache에서만 읽습니다. 공유·다운로드 cache에는 사용하지 않습니다.
    trusted_local: true
    max_entry_bytes: 536870912

  branch_overrides:
    front:
      enabled: true
      representation: full_face_black_canvas
    side:
      enabled: false
      representation: profile_face_black_canvas

model:
  # entrypoint/adapter를 바꾸어 외부 PyTorch 모델을 연결합니다.
  # 둘 다 null이면 contract 확인용 기본 회귀 모델을 사용합니다.
  backend: pytorch
  # adapter는 외부 모델의 입출력을 pipeline 표준 형식으로 변환합니다.
  front:
    enabled: true
    # 외부 모델 코드가 있으면 source_dir에 위치를 지정합니다.
    source_dir: null
    # entrypoint는 package.module:callable 형식으로 지정합니다.
    entrypoint: null
    adapter_entrypoint: null
    init_args: {}
    pretrained:
      # 사전학습 weight 경로와 hash이며 strict는 key와 shape의 일치를 요구합니다.
      path: null
      sha256: null
      strict: true
    input_contract:
      # B는 batch 크기이고 D_front는 외부 encoder의 embedding 크기입니다.
      image_key: front_image
      shape: [B, 3, 224, 224]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
    output_contract:
      gaze_key: gaze_xy
      gaze_shape: [B, 2]
      embedding_key: front_embedding
      embedding_shape: [B, D_front]
      uncertainty_key: null

  side:
    enabled: false
    # 외부 Side 모델 코드가 있으면 source_dir에 위치를 지정합니다.
    source_dir: null
    # Side residual 모델 factory와 adapter를 지정할 수 있습니다.
    entrypoint: null
    adapter_entrypoint: null
    init_args: {}
    pretrained:
      path: null
      sha256: null
      strict: true
    input_contract:
      image_key: side_image
      shape: [B, 3, 224, 224]
      dtype: float32
      color_order: RGB
      value_range: [0.0, 1.0]
    output_contract:
      # Side는 좌표 전체가 아니라 Front y축에 더할 residual만 예측합니다.
      gaze_key: null
      gaze_shape: null
      delta_y_key: delta_y_side
      delta_y_shape: [B, 1]
      embedding_key: side_embedding
      embedding_shape: [B, D_side]
      uncertainty_key: null

fusion:
  # Front의 x는 유지하고 Side residual로 y만 보정합니다.
  enabled: false
  stage: late
  method: y_axis_residual
  entrypoint: null
  input_keys:
    - front.gaze_xy
    - side.delta_y_side
  output_key: gaze_xy
  output_shape: [B, 2]
  # x_final=x_front, y_final=y_front+w_y*delta_y_side입니다.
  residual_weight: 1.0
  learnable_weight: true
  # Side가 무효면 residual을 0으로 두고 Front 좌표를 사용합니다.
  missing_branch_policy: use_available_branch

training:
  # train 명령이 아래 반복·장치·조기 종료 설정을 사용합니다.
  max_epochs: 100
  # auto는 사용 가능한 가속기를 선택하고 devices는 장치 개수입니다.
  accelerator: auto
  devices: 1
  # 학습에 사용할 부동소수점 정밀도입니다.
  precision: 32
  # 여러 batch의 gradient를 누적하고 전체 gradient 크기를 제한합니다.
  gradient_accumulation_steps: 1
  gradient_clip_norm: 1.0
  # validation 간격은 epoch 기준입니다.
  validate_every_n_epochs: 1
  early_stopping:
    # validation metric이 개선되지 않으면 학습을 조기 종료합니다.
    enabled: true
    patience_epochs: 15
    min_delta: 0.0

optimizer:
  # Adam과 AdamW를 지원합니다.
  name: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  # ReduceLROnPlateau 또는 ExponentialLR을 선택합니다.
  enabled: true
  name: ReduceLROnPlateau
  monitor: "val/${metrics.selection_metric}"
  mode: min
  # 지정한 epoch 동안 개선이 없으면 학습률에 factor를 곱합니다.
  factor: 0.5
  patience_epochs: 5
  min_learning_rate: 0.000001

loss:
  # Huber/MSE/weighted L2 중 primary loss를 계산합니다.
  primary:
    # Huber delta는 정규화된 화면 좌표 단위입니다.
    name: huber_xy
    prediction_key: gaze_xy
    target_key: target_gaze_xy
    delta: 0.05
    weight: 1.0
    axis_weights:
      x: 1.0
      y: 1.0
  branch_auxiliary:
    enabled: false
    front_weight: 0.0
    side_weight: 0.0

metrics:
  # report에 적은 metric과 checkpoint 선택 metric만 계산 결과에 남깁니다.
  # cm metric에는 사람별 실제 화면 크기 정보가 필요합니다.
  selection_metric: subject_macro_euclidean_cm
  fallback_selection_metric: subject_macro_euclidean_normalized
  report:
    - euclidean_normalized_mean
    - euclidean_normalized_median
    - euclidean_pixel_mean
    - euclidean_cm_mean
    - mae_x_normalized
    - mae_y_normalized
    - rmse_normalized
    - p90_euclidean_cm
    - p95_euclidean_cm
    - out_of_bounds_rate
    - within_0_05_normalized_rate
  # 회귀의 "정확도"는 정답과의 거리가 threshold 이내인 sample 비율로 정의합니다.
  threshold_rates:
    - name: within_0_05_normalized_rate
      unit: normalized
      threshold: 0.05
      enabled: true
  aggregations: [sample_micro, subject_macro]
  angular_error_deg:
    # 현재 2D runner에서는 사용하지 않는 3D task 확장 계약입니다.
    enabled: false
    prediction_key: gaze_vector_3d
    target_key: gaze_vector_3d

checkpoint:
  # best/last checkpoint는 state_dict 기반 .pt로 저장합니다.
  dir: "${paths.checkpoint_dir}"
  save_best:
    enabled: true
    filename: best_weights.pt
    monitor: "val/${metrics.selection_metric}"
    mode: min
    weights_only: true
  save_last:
    # optimizer와 난수 상태를 포함하여 학습을 재개할 수 있게 저장합니다.
    enabled: true
    filename: last_checkpoint.pt
    include_optimizer: true
    include_scheduler: true
    # 현재 precision=32 실행에는 AMP scaler가 없습니다.
    include_scaler: false
    include_rng_state: true
  resume_from: null

model_export:
  # 학습 완료 후 최종 weight와 입출력 계약을 저장합니다.
  enabled: true
  dir: "${paths.model_dir}"
  filename: final_weights.pt
  format: pytorch_state_dict
  # 전체 config 대신 경로를 제외한 I/O 계약과 lineage hash만 .pt에 넣습니다.
  include_resolved_config: false
  include_model_contract: true

mlflow:
  # prepare의 데이터 lineage와 train/evaluate의 metric·checkpoint를 기록합니다.
  enabled: true
  # 로컬 실행 이력은 SQLite DB에 저장합니다.
  tracking_uri: "${oc.env:MLFLOW_TRACKING_URI,sqlite:///./mlflow.db}"
  # experiment_name은 실행을 묶고 run_name은 개별 실행을 구분합니다.
  experiment_name: "${experiment.name}"
  run_name: "${experiment.run_name}"
  # 데이터 준비 중 CPU와 메모리 사용량을 기록합니다.
  log_system_metrics: true
  # 모든 run에서 사용할 기록 항목을 선택합니다.
  log_resolved_config: true
  # 아래 두 manifest flag는 prepare run에서만 사용합니다.
  log_dataset_manifest: true
  log_split_manifest: true
  # 사람 ID가 든 로컬 prediction CSV는 기본적으로 MLflow에 업로드하지 않습니다.
  # true로 켜도 원격에는 subject_id를 제거한 별도 CSV만 기록합니다.
  log_predictions: false
  # 원본 이미지는 올리지 않고 Python과 package 버전만 기록합니다.
  log_environment: true
  tags:
    schema_version: "${schema_version}"
    data_mode: "${data.mode}"
    pairing_strategy: "${data.pairing.strategy}"
