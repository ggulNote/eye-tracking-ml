project:
  name: ggulnote-gaze
  task: gaze_coordinate_regression

data:
  source: manifest
  manifest_path: manifests/manifest.csv
  dataset_version: dataset-v001
  processed_dir: processed
  train_from_processed: true
  num_samples: 0
  num_participants: 0
  sequence_length: 1
  frame_stride: 1
  raw_height: 720
  raw_width: 1280
  train_fraction: 0.67
  validation_fraction: 0.17
  test_fraction: 0.16

# Keep a useful full frame for the future MediaPipe processor. This is not the
# 128x512 eye patch; that model-specific processor is intentionally still TODO.
preprocessing:
  color_mode: rgb
  output_height: 720
  output_width: 1280
  mean: [0.0, 0.0, 0.0]
  std: [1.0, 1.0, 1.0]

model_io:
  profile: webeyetrack_v1
  image_height: 128
  image_width: 512
  color_mode: rgb
  channels: 3
  layout: BHWC
  image_dtype: float32
  image_range: [0.0, 1.0]
  head_vector_size: 3
  face_origin_3d_size: 3
  embedding_size: 512
  output_size: 2
  output_coordinate_space: screen_centered_normalized
  support_size: 9

# Lightweight placeholder so the local raw->processed->train workflow can be
# tested before BlazeGaze is added.
feature_extraction:
  name: spatial_statistics
  version: v1

model:
  name: ridge
  version: local-placeholder-v1
  alpha: 1.0

training:
  seed: 42
  output_dir: outputs

evaluation:
  screen_width: 1920
  screen_height: 1080
  distance_thresholds: [0.05, 0.10]

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: ggulnote-gaze
  registered_model_name: ggulnote-gaze-local-placeholder
  run_name: local-manifest-placeholder
