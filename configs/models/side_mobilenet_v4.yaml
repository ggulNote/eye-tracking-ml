# side_profile_90.yaml 위에 적용하는 MobileNet-v4 model override입니다.
# 이전 profile의 WebEyeTrack initialization metadata를 아래 값으로 모두 덮어씁니다.
model:
  side:
    entrypoint: gaze_pipeline.models.side.mobilenet_v4:create_model
    init_args:
      model_id: mobilenetv4_conv_small.e2400_r224_in1k
      # false는 network download 없이 random initialization을 사용합니다.
      pretrained: false
      embedding_dim: 256
      # head/eye/iris 각 projection slot의 차원입니다. 최종 auxiliary 폭은 3배입니다.
      auxiliary_dim: 32
      # 외부 입력은 계속 RGB [0,1]이며 ImageNet 정규화는 model 내부에서 수행합니다.
      normalize_imagenet: true
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      dropout: 0.0
    initialization:
      mode: mobilenet_v4
      source_framework: pytorch
      path: null
      load_scope: timm_feature_extractor
      reinitialize: [side_embedding, gaze_output, quality]
      importer_entrypoint: null
    output_contract:
      gaze_key: gaze_xy
      gaze_shape: [B, 2]
      gaze_order: [x, y]
      gaze_coordinate_system: centered_normalized_screen
      embedding_key: side_embedding
      embedding_shape: [B, 256]
      quality_key: quality
      quality_shape: [B, 1]
      quality_activation: sigmoid
      uncertainty_key: null
