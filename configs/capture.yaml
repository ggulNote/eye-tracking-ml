dataset:
  root_directory: data/raw/participants
  calibration_source_directory: data/calibration/setups/macbook_air_m5_13_iphone16
  # intrinsics_2d는 실제 Camera.mat으로 렌즈 왜곡을 제거한 뒤 MediaPipe
  # 영상 좌표에서 화면 좌표를 학습합니다. monitorPose.mat은 요구하지 않습니다.
  geometry_mode: intrinsics_2d
  require_calibration_assets: true

cameras:
  # 이 Mac에서는 연속성 카메라(iPhone)가 0, 내장 웹캠이 1로 인식됩니다.
  # 다른 노트북에서는 --list-cameras로 확인하고 device_index만 조정하세요.
  # role은 저장 폴더와 연결되므로 서로 바꾸지 않습니다.
  - name: macbook
    role: webcam_front
    device_index: 1
    backend: avfoundation
    width: 1280
    height: 720
    fps: 30
    warmup_frames: 5
    # 센서가 약 1초 이상 같은 프레임만 반환하면 즉시 수집을 중단합니다.
    max_identical_frames: 15
    # 연속성 카메라가 순간적으로 프레임을 놓쳐도 바로 전체 촬영을 중단하지 않습니다.
    read_retry_count: 20
    read_retry_delay_ms: 50
    mirror: true
  - name: iphone
    role: iphone_left
    device_index: 0
    backend: avfoundation
    width: 1280
    height: 720
    fps: 30
    warmup_frames: 5
    max_identical_frames: 15
    read_retry_count: 20
    read_retry_delay_ms: 50
    mirror: false

preview:
  enabled: true
  window_name_prefix: Gaze Capture
  preflight_duration_ms: 5000
  camera_width_px: 640
  # 정면 branch만 MediaPipe를 사용합니다. 카메라 키는 webcam/phonecam 중에서
  # 명시하며, phonecam은 측면 이미지 모델의 입력이므로 검출 통과를 요구하지 않습니다.
  landmark_required_cameras: [webcam]
  required_consecutive_detections: 5
  landmark_detection_confidence: 0.3

recording:
  enabled: true
  video_codec: mp4v
  # measured: 촬영 종료 후 프레임 타임스탬프로 실제 FPS를 계산하고
  # MP4 시간축만 보정합니다. 프레임 재압축이나 번호 변경은 없습니다.
  timing_mode: measured

# 정적 점을 클릭으로 확정한 뒤 안정 구간의 두 카메라 프레임을
# 같은 sample id의 이미지로 저장합니다. 원본 MP4도 항상 유지합니다.
frame_capture:
  enabled: true
  image_format: jpg
  jpeg_quality: 95
  samples_per_target: 1
  # 얼굴/눈 검출을 가장 우선하고 선명도와 노출을 보조 기준으로 사용합니다.
  scoring_width_px: 320
  ideal_brightness: 128
  sharpness_reference: 500.0
  eye_open_weight: 100.0
  face_weight: 10.0
  sharpness_weight: 5.0
  brightness_weight: 2.0
  face_scale_factor: 1.1
  face_min_neighbors: 5
  eye_scale_factor: 1.1
  eye_min_neighbors: 4
  # MediaPipe를 적용하는 정면 카메라에서만 FaceMesh+iris 성공을 우선합니다.
  # phonecam은 측면 이미지를 그대로 사용하므로 OpenCV 품질 점수만 반영합니다.
  mediapipe_quality_cameras: [webcam]
  mediapipe_ready_weight: 1000.0

# Dot Test가 정상 완료된 직후 실행할 동기화·특징 추출 설정입니다.
postprocessing:
  enabled: true
  ear_threshold: 0.20
  # 측면 phonecam은 이미지 모델 입력으로 보존하고 MediaPipe는 정면에만 적용합니다.
  feature_cameras: [webcam]
  # 실제 촬영 완료 후 WebEyeTrack의 128x512 눈 ROI, head_vector[3],
  # face_origin_3d[3]까지 이어서 생성합니다. simulation에서는 건너뜁니다.
  webeyetrack_enabled: true
  webeyetrack_config: configs/webeyetrack_preprocessing.yaml

display:
  window_name: Gaze Collection
  fullscreen: true
  # 현재 macOS 화면 설정이 OpenCV에 제공하는 실제 전체화면 크기입니다.
  # 화면 해상도 조절을 바꾸면 다시 확인해야 합니다.
  canvas_width: 1470
  canvas_height: 956
  point_radius_px: 12
  confirmation_ring_radius_px: 36
  background_bgr: [0, 0, 0]
  point_bgr: [255, 255, 255]
  guide_bgr: [48, 48, 48]
  confirmation_ring_bgr: [128, 128, 128]
  confirmed_ring_bgr: [0, 200, 0]

protocols:
  intro_center_ms: 5000
  transition_ms: 3000
  center_refix_ms: 4000
  completion_duration_ms: 3000

  train_static:
    protocol_id: train_static_3x9
    split: train
    columns: 3
    rows: 9
    repeats: 1
    x_min: 0.2
    x_max: 0.8
    y_min: 0.08
    y_max: 0.92
    # 점을 0.4초 이상 본 뒤 참가자가 마우스 왼쪽 버튼 또는 Space로 확정합니다.
    confirmation_required: true
    minimum_fixation_ms: 400
    capture_duration_ms: 650
    transition_duration_ms: 150
    # simulation에서는 사람이 클릭할 수 없으므로 이 시점에 자동 확정합니다.
    simulation_confirm_after_ms: 600
    random_seed: 20260807

  evaluation_static:
    protocol_id: evaluation_static_3x6
    split: evaluation
    columns: 3
    rows: 6
    repeats: 1
    x_min: 0.2
    x_max: 0.8
    y_min: 0.1325
    y_max: 0.8675
    y_positions: [0.1325, 0.2375, 0.4475, 0.5525, 0.7625, 0.8675]
    confirmation_required: true
    minimum_fixation_ms: 400
    capture_duration_ms: 650
    transition_duration_ms: 150
    simulation_confirm_after_ms: 600
    random_seed: 20260808

  vertical_click:
    protocol_id: vertical_click_3col_6row
    split: train
    columns: [0.2, 0.5, 0.8]
    rows: 6
    y_min: 0.08
    y_max: 0.92
    # 각 열에서 6점을 위→아래로 본 뒤 같은 6점을 아래→위로 다시 봅니다.
    confirmation_required: true
    minimum_fixation_ms: 400
    capture_duration_ms: 650
    transition_duration_ms: 150
    simulation_confirm_after_ms: 600

simulation:
  fps: 10
  width: 320
  height: 180
  phone_delay_ms: 5.0
  base_unix_timestamp_ns: 1700000000000000000
