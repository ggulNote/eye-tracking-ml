project:
  name: ggulnote-gaze
  task: gaze_coordinate_regression

data:
  source: synthetic
  manifest_path: null
  num_samples: 96
  num_participants: 12
  sequence_length: 4
  raw_height: 32
  raw_width: 48
  train_fraction: 0.67
  validation_fraction: 0.17
  test_fraction: 0.16

preprocessing:
  output_height: 24
  output_width: 32
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]

feature_extraction:
  name: identity
  version: v1

model:
  name: ridge
  version: v1
  alpha: 1.0

training:
  seed: 42
  output_dir: outputs

evaluation:
  screen_width: 1920
  screen_height: 1080
  distance_thresholds: [0.05, 0.10]

mlflow:
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: ggulnote-gaze
  registered_model_name: ggulnote-gaze-ridge
  run_name: synthetic-ridge-baseline

